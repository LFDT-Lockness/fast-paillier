name: Rust

permissions:
  contents: read

on:
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUSTFLAGS: --deny warnings

jobs:
  build-and-test-num-bigint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Build
      run: |
        cargo build --features serde
        cargo bench --no-run --features serde
    - name: Run tests
      run: cargo test --features serde
  build-and-test-rug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Build
      run: |
        cargo build --no-default-features --features serde,backend-rug
        cargo bench --no-run --no-default-features --features serde,backend-rug
    - name: Run tests
      run: cargo test --no-default-features --features serde,backend-rug
  build-and-test-all-features:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Build
      run: |
        cargo build --all-features
        cargo bench --no-run --all-features
    - name: Run tests
      run: cargo test --all-features

  build-with-different-feature-sets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
        - "backend-rug,std"
        - "backend-num-bigint,std"
        - "backend-num-bigint,no_std"
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Build
      run: |
        cargo build --no-default-features --features ${{ matrix.features }}
        cargo bench --no-run --no-default-features --features ${{ matrix.features }}

  build-wasm-nostd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Install wasm32-unknown-unknown toolchain
      run: rustup target add wasm32-unknown-unknown
    - name: Build
      run: |
        cargo check -p fast-paillier \
          --no-default-features \
          --features backend-num-bigint,no_std,serde \
          --target wasm32-unknown-unknown

  check-fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - name: Check formatting
      run: cargo fmt --all -- --check
  check-clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Run clippy
      run: "cargo clippy --all --all-features --lib -- -D clippy::all"
    - name: Run clippy tests
      run: "cargo clippy --tests --benches --all-features -- -D clippy::all"
  check-changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
    - name: Check changelogs
      run: ./.github/changelog.sh
