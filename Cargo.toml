[package]
name = "fast-paillier"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Optimized Paillier encryption scheme"
repository = "https://github.com/LFDT-Lockness/fast-paillier"
categories = ["algorithms", "cryptography"]
keywords = ["paillier", "public-key", "encryption"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rug = { version = "1.24", default-features = false, features = ["std", "integer", "rand"] }
num-bigint = { version = "0.4.6", default-features = false, features = ["std", "rand"] }
num-traits = "0.2.19"
num-integer = "0.1.46"
glass_pumpkin = "1.7"

rand = "0.8"
rand_core = "0.6"

bytemuck = { version = "1.5", features = ["derive"] }
thiserror = "1"

serde = { version = "1", optional = true }
hex = { version = "0.4.3", optional = true }

[dev-dependencies]
rand_dev = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }
libpaillier = { version = "0.5", default-features = false, features = ["gmp"] }
serde_json = "1"
ciborium = "0.2.2"

[features]
serde = ["dep:serde", "dep:hex", "rug/serde", "num-bigint/serde"]

[[bench]]
name = "comparison"
harness = false

[profile.dev.package.num-bigint]
opt-level = 3
